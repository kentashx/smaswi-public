<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>メールアドレス認証 - スマスイ | SmartSwim</title>
        <meta name="description" content="スマスイへようこそ！メールアドレスの認証が完了しました。">
        <link rel="icon" type="image/svg+xml" href="icon.svg">
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #0088ff;
            --secondary-color: #00d4ff;
            --dark-color: #1a1a2e;
            --light-color: #f8f9fa;
            --text-color: #333;
            --text-light: #666;
            --gradient: linear-gradient(135deg, #0088ff 0%, #00d4ff 100%);
            --success-color: #00c853;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'メイリオ', Meiryo, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: var(--light-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: var(--gradient);
            padding: 3rem 2rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.05)"/></svg>');
            opacity: 0.3;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .logo-text {
            font-size: 1.2rem;
            opacity: 0.95;
        }

        .content {
            padding: 3rem 2rem;
            text-align: center;
        }

        .status-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: bounce 1s ease;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        .status-icon.success {
            color: var(--success-color);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .message {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .info-box {
            background: var(--light-color);
            padding: 1.5rem;
            border-radius: 15px;
            margin: 2rem 0;
            text-align: left;
        }

        .info-box h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .info-box ul {
            list-style: none;
            padding: 0;
        }

        .info-box li {
            padding: 0.5rem 0;
            padding-left: 1.8rem;
            position: relative;
            color: var(--text-color);
        }

        .info-box li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--secondary-color);
            font-weight: bold;
            font-size: 1.2rem;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        .button {
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .button-primary {
            background: var(--gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 136, 255, 0.3);
        }

        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 255, 0.4);
        }

        .button-secondary {
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .button-secondary:hover {
            background: var(--light-color);
        }

        .footer {
            padding: 2rem;
            text-align: center;
            background: var(--light-color);
            border-top: 1px solid #e0e0e0;
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--secondary-color);
        }

        .help-text {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 2rem;
        }

        .help-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .help-text a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                border-radius: 20px;
            }

            .header {
                padding: 2rem 1.5rem;
            }

            .content {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .message {
                font-size: 1rem;
            }

            .status-icon {
                font-size: 4rem;
            }
        }

        /* Hidden class */
        .hidden {
            display: none;
        }
        </style>
    </head>
    <body>
        <div class="container">
            <!-- Header -->
            <div class="header">
                <div class="header-content">
                    <div class="logo">🏊 スマスイ</div>
                    <div class="logo-text">SmartSwim</div>
                </div>
            </div>
            <!-- Content -->
            <div class="content">
                <div id="successState" class="hidden">
                    <div class="status-icon success">✓</div>
                    <h1>メールアドレス認証完了！</h1>
                    <p class="message">
                        認証が正常に完了しました。
                        <br>
                        スマスイへようこそ！
                    </p>
                    <div class="info-box">
                        <h3>今すぐできること</h3>
                        <ul>
                            <li>水泳と筋トレの練習を記録</li>
                            <li>ベストタイムを管理</li>
                            <li>チームに参加して仲間と共有</li>
                            <li>成長を可視化してモチベーション向上</li>
                        </ul>
                    </div>
                    <div class="button-container">
                        <a href="index.html" class="button button-primary">
                            公式サイトに戻る
                        </a>
                    </div>
                    <p class="help-text">
                        アプリをダウンロード済みの方は、アプリを開いてログインしてください。
                        <br>
                        まだダウンロードしていない方は、App Store / Google Playからダウンロードしてください。
                    </p>
                </div>
            </div>
            <!-- Footer -->
            <div class="footer">
                <p>
                    <a href="terms_of_service.html">利用規約</a>
                    ・
                    <a href="privacy_policy.html">プライバシーポリシー</a>
                </p>
                <p style="margin-top: 0.5rem; color: var(--text-light); font-size: 0.9rem;">
                    &copy; 2025 SmartSwim. All rights reserved.
                </p>
            </div>
        </div>
        <script>
        // 初期表示（成功状態を表示）
        document.addEventListener('DOMContentLoaded', () => {
            // 成功状態を表示
            const successState = document.getElementById('successState');
            successState.classList.remove('hidden');
        });
        </script>
    </body>
</html>
