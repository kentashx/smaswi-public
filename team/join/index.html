<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマスイ | チーム参加</title>
    <meta name="description" content="スマスイのチーム参加リンクです。アプリを開くか、ストアからダウンロードしてください。">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --primary: #2563eb;
        --secondary: #06b6d4;
        --accent: #f97316;
        --text: #1e293b;
        --text-light: #475569;
        --card: rgba(255, 255, 255, 0.92);
        --bg: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
      }

      body {
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }

      .card {
        width: min(520px, 100%);
        background: var(--card);
        border-radius: 24px;
        padding: 28px 24px 30px;
        box-shadow: 0 20px 60px rgba(37, 99, 235, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.65);
        text-align: center;
      }

      .logo {
        font-family: 'Quicksand', sans-serif;
        font-weight: 700;
        font-size: 1.6rem;
        color: var(--primary);
        letter-spacing: 0.02em;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 1.5rem;
        line-height: 1.4;
        margin-bottom: 12px;
      }

      p {
        color: var(--text-light);
        line-height: 1.7;
        margin-bottom: 20px;
      }

      .details {
        background: rgba(37, 99, 235, 0.08);
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 20px;
        text-align: left;
        font-size: 0.95rem;
      }

      .details strong {
        color: var(--text);
      }

      .buttons {
        display: grid;
        gap: 12px;
        margin-bottom: 12px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        border: 1px solid transparent;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button-primary {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
      }

      .button-secondary {
        background: white;
        color: var(--primary);
        border-color: rgba(37, 99, 235, 0.2);
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .note {
        font-size: 0.85rem;
        color: var(--text-light);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">スマスイ</div>
      <h1>チーム参加</h1>
      <p>このリンクからアプリが起動します。アプリが未インストールの場合はストアからダウンロードしてください。</p>

      <div class="details" id="details">
        <div><strong>チームID:</strong> <span id="team-id">-</span></div>
      </div>

      <div class="buttons">
        <a class="button button-primary" id="open-app" href="#">アプリを開く</a>
        <a class="button button-secondary" href="https://apps.apple.com/jp/app/%E3%82%B9%E3%83%9E%E3%82%B9%E3%82%A4/id6756019486">App Storeでダウンロード</a>
        <a class="button button-secondary" href="https://play.google.com/store/apps/details?id=jp.smartswim.app">Google Playでダウンロード</a>
      </div>
      <div class="note">ヒント: アプリがインストール済みなら通常は自動で起動します。</div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const teamId = params.get('teamId') || '';

      document.getElementById('team-id').textContent = teamId || '-';

      const iosUrl = `jp.smartswim.app://team/join?teamId=${encodeURIComponent(teamId)}`;
      const androidUrl =
        `intent://team/join?teamId=${encodeURIComponent(teamId)}` +
        `#Intent;scheme=jp.smartswim.app;package=jp.smartswim.app;end`;
      const isAndroid = /Android/i.test(navigator.userAgent);

      const openApp = document.getElementById('open-app');
      openApp.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = isAndroid ? androidUrl : iosUrl;
      });
    </script>
  </body>
</html>
